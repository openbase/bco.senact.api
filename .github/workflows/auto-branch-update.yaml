name: Autoupdate PR branches

on:
  push:
    branches:
      - dev
      - "epic/**"

jobs:
  autoupdate:
    name: Autoupdate
    runs-on: ubuntu-22.04
    steps:
      - name: Update pull request branches
        uses: docker://chinthakagodawita/autoupdate-action:v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_CONFLICT_ACTION: ignore
