plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'org.openbase'
version = providers.gradleProperty('releaseVersion')
        .map { it.replaceFirst('^v', '') }
        .orElse(providers.gradleProperty('version'))
        .get()

description = 'Network control API for the homeautomation gateway module senact.'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

dependencies {
    api 'org.openbase:jul.exception:3.7.4'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'bco.senact.api'

            pom {
                name = 'BCO Senact API'
                description = project.description
                url = 'https://github.com/openbase/bco.senact.api/wiki'
                inceptionYear = '2013'

                organization {
                    name = 'openbase.org'
                    url = 'https://github.com/openbase'
                }

                licenses {
                    license {
                        name = 'GPLv3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    }
                }

                developers {
                    developer {
                        id = 'DivineThreepwood'
                        name = 'Marian Pohling'
                        email = 'divine@openbase.org'
                        url = 'https://github.com/DivineThreepwood'
                        organization = 'openbase.org'
                        organizationUrl = 'https://github.com/openbase'
                        roles = ['developer', 'architect', 'tester']
                        timezone = '+1'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/openbase/bco.senact.api.git'
                    developerConnection = 'scm:git:https://github.com/openbase/bco.senact.api.git'
                    url = 'https://github.com/openbase/bco.senact.api'
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            username.set(providers.gradleProperty('MAVEN_CENTRAL_USERNAME'))
            password.set(providers.gradleProperty('MAVEN_CENTRAL_TOKEN'))
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
        }
    }
}

def encodedSigningKey = providers.gradleProperty('OPENBASE_GPG_PRIVATE_KEY').orNull
if (encodedSigningKey) {
    def signingKey = new String(
            Base64.decoder.decode(encodedSigningKey),
            java.nio.charset.StandardCharsets.UTF_8
    )
    def signingPassphrase = providers.gradleProperty('OPENBASE_GPG_PRIVATE_KEY_PASSPHRASE').getOrElse('')

    signing {
        useInMemoryPgpKeys(signingKey, signingPassphrase)
        sign publishing.publications.mavenJava
    }
}

application {
    mainClass = 'org.openbase.bco.senact.api.SenactDebugFrame'
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}

tasks.register('runServerService', JavaExec) {
    group = 'application'
    description = 'Runs the Senact server service.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openbase.bco.senact.api.SenactServerService'
}

tasks.register('runDebugFrame', JavaExec) {
    group = 'application'
    description = 'Runs the Senact debug frame.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openbase.bco.senact.api.SenactDebugFrame'
}
